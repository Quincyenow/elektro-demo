<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy1:#050b1c;      /* tiefes Navy */
    --navy2:#0b1c3f;      /* Navy blau  */
    --navy3:#122a5c;      /* helleres Navy */
    --ink:#F7F5EF;        /* off-white */
    --muted:#AEB7CC;      /* kühles Grau-blau */
    --gold:#E8C877;       /* gold */
    --gold2:#F6E4B0;      /* helles gold */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;
    color:var(--ink);position:relative;
    background:
      radial-gradient(1600px 1100px at 30% 8%,  rgba(35,72,140,.55), transparent 60%),
      radial-gradient(1400px 1000px at 88% 92%, rgba(10,26,60,.9),  transparent 55%),
      linear-gradient(120deg, var(--navy1) 0%, var(--navy2) 52%, var(--navy3) 100%);
  }

  /* ---- goldene Lichtstreifen (cinematic light streaks) ---- */
  .streaks{position:absolute;inset:-10%;overflow:hidden;filter:blur(2px)}
  .streaks i{position:absolute;left:-20%;width:150%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(232,200,119,.0) 10%,rgba(232,200,119,.55),rgba(246,228,176,.85),rgba(232,200,119,.35),transparent 92%);
    transform-origin:left center;opacity:.5}
  .streaks i:nth-child(1){top:20%;transform:rotate(-18deg);opacity:.75;height:3px}
  .streaks i:nth-child(2){top:34%;transform:rotate(-18deg);opacity:.25}
  .streaks i:nth-child(3){top:52%;transform:rotate(-18deg);opacity:.5;height:2px}
  .streaks i:nth-child(4){top:70%;transform:rotate(-18deg);opacity:.18}
  .streaks i:nth-child(5){top:83%;transform:rotate(-18deg);opacity:.4}
  /* weicher Gold-Glow oben rechts */
  .glow{position:absolute;top:-14%;right:2%;width:1200px;height:1200px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,200,119,.20), rgba(232,200,119,.05) 40%, transparent 62%);
    filter:blur(20px)}
  /* Vignette */
  .vign{position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(2,6,16,.6) 100%)}

  /* ---- SAFE ZONE: 1546 x 423 zentriert (auf allen Geräten sichtbar) ---- */
  .safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:1330px;height:423px;
    display:grid;grid-template-columns:350px 1fr 460px;align-items:center;gap:44px;z-index:3}

  /* ---------- LINKS: freigestelltes Foto (frei positioniert) ---------- */
  .portrait{position:absolute;left:606px;bottom:275px;width:470px;height:640px;z-index:2}
  .portrait .pglow{position:absolute;left:50%;top:238px;transform:translate(-50%,-50%);
    width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,200,119,.34), rgba(232,200,119,.10) 40%, transparent 64%);
    filter:blur(14px)}
  .portrait img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    height:640px;width:auto;object-fit:contain;object-position:bottom;
    filter:drop-shadow(0 20px 34px rgba(0,0,0,.55));
    -webkit-mask:linear-gradient(to bottom,#000 80%,transparent 100%);
            mask:linear-gradient(to bottom,#000 80%,transparent 100%)}
  /* Fallback-Platzhalter, falls kein Foto */
  .noimg{position:absolute;inset:0;display:none}

  /* ---------- MITTE: Name + Rolle ---------- */
  .center{display:flex;flex-direction:column;justify-content:center;gap:13px}
  .kicker{font-size:17px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold);
    font-weight:700;padding-left:4px}
  .name{font-size:108px;line-height:.9;font-weight:800;letter-spacing:.01em;
    background:linear-gradient(180deg,#FFFFFF 0%, #EAF0FB 45%, #C9D6F0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 60px rgba(232,200,119,.12)}
  .role{display:flex;align-items:center;gap:14px;margin-top:4px}
  .role .bar{width:54px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--gold2),var(--gold))}
  .role .txt{font-size:31px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);font-weight:700}

  /* ---------- RECHTS: Slogan ---------- */
  .slogan{position:relative;padding-left:30px;border-left:3px solid rgba(232,200,119,.6)}
  .quote{position:absolute;left:16px;top:-34px;font-size:92px;line-height:1;
    color:rgba(232,200,119,.28);font-weight:800;font-family:Georgia,serif}
  .slogan .l1{font-size:45px;font-weight:800;line-height:1.06;color:var(--ink)}
  .slogan .l2{font-size:45px;font-weight:800;line-height:1.06;
    background:linear-gradient(90deg,var(--gold2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .slogan .sub{margin-top:16px;font-size:19px;letter-spacing:.05em;color:var(--muted)}

  /* ---------- CTA-Pill (Conversion-Element) ---------- */
  .cta{margin-top:26px;display:inline-flex;align-items:center;gap:13px;
    background:linear-gradient(90deg,var(--gold2),var(--gold));
    color:#221a08;font-weight:800;font-size:24px;letter-spacing:.005em;
    padding:15px 30px;border-radius:999px;
    box-shadow:0 14px 28px rgba(232,200,119,.32)}
  .cta .arw{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.14);
    display:grid;place-items:center;font-size:17px;flex:none}

  /* dekorative Randzeilen außerhalb der Safe-Zone */
  .footer{position:absolute;left:130px;bottom:70px;font-size:19px;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(174,183,204,.55);font-weight:600;z-index:3}

  /* ---------- Ecken-Hinweis unten rechts (zeigt zu Kanal-Links) ---------- */
  .corner-hint{position:absolute;right:210px;bottom:220px;z-index:3;text-align:right;
    font-size:24px;line-height:1.35;font-weight:700;letter-spacing:.01em;color:var(--gold2)}
  .corner-arrow{position:absolute;right:24px;bottom:24px;z-index:3}
</style>
</head>
<body>
  <div class="streaks"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="glow"></div>
  <div class="vign"></div>

  <!-- LINKS: freigestelltes Foto, Blick nach rechts (zur Mitte) -->
  <div class="portrait">
    <div class="pglow"></div>
    <img src="foto_cut.png" alt="Dr. Quincy">
  </div>

  <div class="safe">
    <div></div><!-- Spalte 1: Platz fuer Portrait -->

    <!-- MITTE: Name + Rolle -->
    <div class="center">
      <div class="kicker">Dating &amp; Beziehung</div>
      <div class="name">DR. QUINCY</div>
      <div class="role"><span class="bar"></span><span class="txt">Dating-Coach</span></div>
    </div>

    <!-- RECHTS: Slogan -->
    <div class="slogan">
      <span class="quote">&ldquo;</span>
      <div class="l1">Dating mit System.</div>
      <div class="l2">Psychologisch fundiert.</div>
      <div class="sub">Klarheit · Selbstsicherheit · echte Verbindung</div>
      <div class="cta"><span class="arw">→</span>Gratis-Leitfaden: Ansprechangst überwinden</div>
    </div>
  </div>

  <div class="footer">Neue Videos jede Woche</div>

  <div class="corner-hint">Hier klicken für<br>Gratis-Report</div>
  <svg class="corner-arrow" width="270" height="220" viewBox="0 0 270 220" fill="none">
    <defs>
      <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F6E4B0"/>
        <stop offset="1" stop-color="#E8C877"/>
      </linearGradient>
    </defs>
    <path d="M14,10 C60,90 140,150 224,196" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M224,196 L192,182 M224,196 L200,222" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round"/>
  </svg>
</body>
</html>
