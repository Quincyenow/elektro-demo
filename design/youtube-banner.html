<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy1:#050b1c;      /* tiefes Navy */
    --navy2:#0b1c3f;      /* Navy blau  */
    --navy3:#122a5c;      /* helleres Navy */
    --ink:#F7F5EF;        /* off-white */
    --muted:#AEB7CC;      /* kühles Grau-blau */
    --gold:#E8C877;       /* gold */
    --gold2:#F6E4B0;      /* helles gold */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;
    color:var(--ink);position:relative;
    background:
      radial-gradient(1600px 1100px at 30% 8%,  rgba(35,72,140,.55), transparent 60%),
      radial-gradient(1400px 1000px at 88% 92%, rgba(10,26,60,.9),  transparent 55%),
      linear-gradient(120deg, var(--navy1) 0%, var(--navy2) 52%, var(--navy3) 100%);
  }

  /* ---- goldene Lichtstreifen (cinematic light streaks) ---- */
  .streaks{position:absolute;inset:-10%;overflow:hidden;filter:blur(2px)}
  .streaks i{position:absolute;left:-20%;width:150%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(232,200,119,.0) 10%,rgba(232,200,119,.55),rgba(246,228,176,.85),rgba(232,200,119,.35),transparent 92%);
    transform-origin:left center;opacity:.5}
  .streaks i:nth-child(1){top:20%;transform:rotate(-18deg);opacity:.75;height:3px}
  .streaks i:nth-child(2){top:34%;transform:rotate(-18deg);opacity:.25}
  .streaks i:nth-child(3){top:52%;transform:rotate(-18deg);opacity:.5;height:2px}
  .streaks i:nth-child(4){top:70%;transform:rotate(-18deg);opacity:.18}
  .streaks i:nth-child(5){top:83%;transform:rotate(-18deg);opacity:.4}
  /* weicher Gold-Glow oben rechts */
  .glow{position:absolute;top:-14%;right:2%;width:1200px;height:1200px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,200,119,.20), rgba(232,200,119,.05) 40%, transparent 62%);
    filter:blur(20px)}
  /* Vignette */
  .vign{position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(2,6,16,.6) 100%)}

  /* ---- SAFE ZONE: 1546 x 423 zentriert (auf allen Geräten sichtbar) ---- */
  .safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:1546px;height:423px;
    display:grid;grid-template-columns:380px 1fr 600px;align-items:center;gap:50px;z-index:3}

  /* ---------- LINKS: freigestelltes Foto ---------- */
  .photo{position:relative;width:380px;height:400px;justify-self:center}
  .photo .halo{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,200,119,.28), transparent 62%);filter:blur(6px)}
  .photo .arc{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:344px;height:344px;border-radius:50%;
    background:conic-gradient(from 160deg, var(--gold2), var(--gold), transparent 55%, var(--gold));
    -webkit-mask:radial-gradient(circle,transparent 165px,#000 167px);
            mask:radial-gradient(circle,transparent 165px,#000 167px)}
  /* echtes Foto, falls design/foto.png vorhanden – sonst Platzhalter darunter */
  .photo .real{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:380px;height:400px;object-fit:contain;object-position:bottom;z-index:2;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
  .photo .ph{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:312px;height:312px;border-radius:50%;overflow:hidden;
    background:radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,.08), transparent 55%), #0c1c3d;
    border:2px dashed rgba(232,200,119,.55);display:flex;align-items:flex-end;justify-content:center}
  .photo .ph svg{width:230px;height:230px;opacity:.8;transform:translateX(8px)}
  .photo .tag{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:4;
    background:rgba(5,11,28,.9);border:1px solid rgba(232,200,119,.5);color:var(--gold);
    font-size:16px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    padding:7px 15px;border-radius:999px;white-space:nowrap}

  /* ---------- MITTE: Name + Rolle ---------- */
  .center{display:flex;flex-direction:column;justify-content:center;gap:18px}
  .kicker{font-size:21px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);
    font-weight:700;padding-left:5px}
  .name{font-size:138px;line-height:.9;font-weight:800;letter-spacing:.01em;
    background:linear-gradient(180deg,#FFFFFF 0%, #EAF0FB 45%, #C9D6F0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 60px rgba(232,200,119,.12)}
  .role{display:flex;align-items:center;gap:18px;margin-top:6px}
  .role .bar{width:70px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--gold2),var(--gold))}
  .role .txt{font-size:40px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);font-weight:700}

  /* ---------- RECHTS: Slogan ---------- */
  .slogan{position:relative;padding-left:38px;border-left:3px solid rgba(232,200,119,.6)}
  .quote{position:absolute;left:20px;top:-42px;font-size:120px;line-height:1;
    color:rgba(232,200,119,.28);font-weight:800;font-family:Georgia,serif}
  .slogan .l1{font-size:58px;font-weight:800;line-height:1.06;color:var(--ink)}
  .slogan .l2{font-size:58px;font-weight:800;line-height:1.06;
    background:linear-gradient(90deg,var(--gold2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .slogan .sub{margin-top:22px;font-size:23px;letter-spacing:.05em;color:var(--muted)}

  /* dekorative Randzeilen außerhalb der Safe-Zone */
  .footer{position:absolute;left:130px;bottom:96px;font-size:22px;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(174,183,204,.6);font-weight:600;z-index:3}
  .footer2{position:absolute;right:130px;bottom:96px;font-size:22px;letter-spacing:.14em;
    color:rgba(232,200,119,.7);font-weight:700;z-index:3}
</style>
</head>
<body>
  <div class="streaks"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="glow"></div>
  <div class="vign"></div>

  <div class="safe">
    <!-- LINKS: freigestelltes Foto, Blick nach rechts -->
    <div class="photo">
      <div class="halo"></div>
      <div class="arc"></div>
      <div class="ph">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g fill="rgba(232,200,119,.72)">
            <path d="M118 66c0 22-16 40-36 40s-36-18-36-40 16-40 36-40c14 0 26 8 32 20 3 6 4 13 4 20z"/>
            <path d="M30 200c0-40 28-70 64-70s64 30 64 70z"/>
          </g>
          <path d="M150 88 l20 12 -20 12" fill="none" stroke="rgba(246,228,176,.95)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <!-- Wenn design/foto.png existiert, wird es hier eingeblendet und verdeckt den Platzhalter -->
      <img class="real" src="foto.png" alt="" onerror="this.style.display='none'">
      <div class="tag">Dein Foto · Blick nach rechts →</div>
    </div>

    <!-- MITTE: Name + Rolle -->
    <div class="center">
      <div class="kicker">Dating &amp; Beziehung</div>
      <div class="name">DR. QUINCY</div>
      <div class="role"><span class="bar"></span><span class="txt">Dating-Coach</span></div>
    </div>

    <!-- RECHTS: Slogan -->
    <div class="slogan">
      <span class="quote">&ldquo;</span>
      <div class="l1">Dating mit System.</div>
      <div class="l2">Psychologisch fundiert.</div>
      <div class="sub">Klarheit · Selbstsicherheit · echte Verbindung</div>
    </div>
  </div>

  <div class="footer">Neue Videos jede Woche</div>
  <div class="footer2">▶ Abonnieren</div>
</body>
</html>
